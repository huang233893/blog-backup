top:
  - class_name: card-boringbay
    id_name:
    name: 无聊湾
    icon: 
    html: |
        <a title="无聊湾 🥱 The Boring Bay" href="https://boringbay.com"><img height="60px" src="https://boringbay.com/api/badge/www.sumi233.top" loading="eager" class="no-lazy" referrerpolicy="origin"></img></a>
  - class_name: card-blogclub
    id_name:
    name: 博阅榜
    icon: 
    html: |
        <script>(function(){'use strict';function loadBadge(){const img=document.getElementById("blogclub-badge");if(!img)return;if(img.src&&img.src.indexOf('blogsclub.org')!==-1&&img.style.display!=='none')return;img.style.display="none";img.src="";const doLoad=()=>{const url=`https://www.blogsclub.org/badge/www.sumi233.top?ref=${encodeURIComponent(window.location.origin)}&t=${Date.now()}_${Math.random()}`;img.src=url;img.onload=()=>{img.style.display="inline-block";img.style.visibility="visible";img.style.opacity="1";};img.onerror=()=>{setTimeout(doLoad,1000);};};doLoad();}let observer=null;function startObserving(){if(observer){observer.disconnect();observer=null;}if(document.getElementById("blogclub-badge")){loadBadge();return;}observer=new MutationObserver((mutations,obs)=>{if(document.getElementById("blogclub-badge")){loadBadge();obs.disconnect();observer=null;}});observer.observe(document.body,{childList:true,subtree:true});}if(document.readyState==='complete'||document.readyState==='interactive'){startObserving();}else{document.addEventListener('DOMContentLoaded',startObserving);}window.addEventListener("pjax:complete",function(){setTimeout(startObserving,300);});})();</script>
  - class_name: calendar
    id_name: card-widget-calendar
    name:
    icon:
    order: -1
    html: |
      <div id="calendar-area-left">
        <div id="calendar-week"></div>
        <div id="calendar-date" style="font-size: 48px;"></div>
        <div id="calendar-solar"></div>
        <div id="calendar-lunar"></div>
      </div>
      <div id="calendar-area-right">
        <div id="calendar-main">
        </div>
      </div>

bottom:
  - class_name: schedule
    id_name: card-widget-schedule
    name:
    icon:
    order: -1
    html: |
      <div id="schedule-area-left">
        <div id="schedule-title">距离除夕</div>
        <div id="schedule-days"></div>
        <div id="schedule-date">2027-2-5</div>
      </div>
      <div id="schedule-area-right">
        <div class="schedule-r0">
          <div class="schedule-d0">本年</div>
          <div class="schedule-d1">
            <span id="p_span_year" class="aside-span1"></span>
            <span class="aside-span2">还剩<a></a>天</span>
            <progress max="365" id="pBar_year"></progress>
          </div>
        </div>
        <div class="schedule-r1">
          <div class="schedule-d0">本月</div>
          <div class="schedule-d1">
            <span id="p_span_month" class="aside-span1"></span>
            <span class="aside-span2">还剩<a></a>天</span>
            <progress max="30" id="pBar_month"></progress>
          </div>
        </div>
        <div class="schedule-r2">
          <div class="schedule-d0">本周</div>
          <div class="schedule-d1">
            <span id="p_span_week" class="aside-span1"></span>
            <span class="aside-span2">还剩<a></a>天</span>
            <progress max="7" id="pBar_week"></progress>
          </div>
        </div>
      </div>



